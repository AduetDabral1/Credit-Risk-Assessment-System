version: '3.8'

networks:
  monitoring-net:
    driver: bridge

volumes:
  prom_data:
  grafana_data:
  mlflow_db:
  mlflow_artifacts:

services:
  # 1. Local MLflow Model Registry & Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: credit-risk-mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_db:/mlflow
      - mlflow_artifacts:/mlruns
    networks:
      - monitoring-net

  # 2. Local Prometheus Time-Series Scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: credit-risk-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-net

  # 3. Local Grafana Dashboard Server
  grafana:
    image: grafana/grafana:latest
    container_name: credit-risk-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring-net
    depends_on:
      - prometheus
