name: CI/CD Pipeline & Render Deployment

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    name: 🧪 Automated Tests & Regulatory Audit Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/test_api.py

      - name: Run Fairness Audit (ECOA 80% Gate)
        run: |
          python audit_fairness.py

      - name: Run PSI Drift Check
        run: |
          python monitor_psi.py

  docker-build:
    name: 🐳 Docker Container Build & Smoke Test
    needs: test-and-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t credit-risk-api:test .

      - name: Container Smoke Test
        run: |
          docker run -d --name test-container -p 8000:8000 -e PORT=8000 credit-risk-api:test
          sleep 5
          curl -f http://localhost:8000/metrics || (docker logs test-container && exit 1)
          docker stop test-container

  deploy-render:
    name: 🚀 Deploy to Render Web Service
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "ℹ️ Note: 'RENDER_DEPLOY_HOOK_URL' secret is not set in repository settings."
            echo "👉 To enable automatic deployment on push: go to your Render Web Service dashboard, copy the Deploy Hook URL, and add it as a secret named 'RENDER_DEPLOY_HOOK_URL' in GitHub Repo Settings > Secrets."
          else
            echo "🚀 Triggering Render zero-downtime deployment..."
            curl -s -X POST "$RENDER_HOOK"
            echo "✅ Deployment triggered successfully on Render!"
          fi
